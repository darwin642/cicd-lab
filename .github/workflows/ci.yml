name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test HTML
        run: |
          grep -q "CI/CD Lab" index.html

      - name: Build Docker image
        run: docker build -t cicd-lab .